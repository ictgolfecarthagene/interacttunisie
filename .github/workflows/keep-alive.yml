name: Prevent Supabase Inactivity

on:
  schedule:
    - cron: "0 0 * * 0,4"
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    env:
      DB_URL: https://${{ secrets.SUPABASE_URL }}
      DB_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Ping Supabase Database
        run: |
          curl -X GET "$DB_URL/rest/v1/clubs?select=id&limit=1" \
          -H "apikey: $DB_KEY" \
          -H "Authorization: Bearer $DB_KEY"